<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Content calendar demo — one feed, three viewers | Lattice Grid</title>
    <meta
      name="description"
      content="A social content calendar: one Data Router feed of synthetic posts, shown as a grid, a kanban board and a FullCalendar-style week/month calendar, switchable with a table / board / calendar toggle. Built with Lattice Grid."
    />
    <link rel="icon" href="data:," />
    <!--
      The grid and its modules, from jsDelivr. Every address names the exact
      release, 1.83.1, with the hash of the file it expects, so the page can
      never quietly pick up a different build than the one it was checked
      against.
    -->

      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.86.4/lattice-grid.min.css"
      integrity="sha384-sG8zKCXM5yJtGUhhOPgYefmKlJkz+eZqWAG/AvipX+FIiiTmFyU+t2wemGufqOTj"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.86.4/lattice-grid.min.js"
      integrity="sha384-szV9iJG9Rw7/ugpLmd46g2mdpg55HMARqWd46CIBvOBnqkHE4PT42xIZmJEMDBkp"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.86.4/modules/data-router.min.js"
      integrity="sha384-pzZm/EHlBpNY5WhcUBCVJwTDwl5Kh11UmmQHi/zZGxqlpwHtUupvQPY6BlIG/fbi"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.86.4/modules/kanban.min.js"
      integrity="sha384-XTprc62drNdonC1hX/KZiDUYDQLUyMq/PCUMOThGPNQKiUzqZBRZ8xbG6qhMl6BL"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.86.4/modules/calendar.min.js"
      integrity="sha384-13nXFB9wRij8kaEQ6p4QISeB7SjYpoERCbt3eb0z3clzREzk16knBU25VfS7G/Ri"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@toclocoinc/lattice-grid@1.86.4/modules/kpi.min.js"
      integrity="sha384-olDrPrYzxb0joei4RDk59vk6CwYYFTMDFQxUaFYMCVdh0fup+Xd9VNZkN1E4JY6t"
      crossorigin="anonymous"
    ></script>
    <script>
      // Bound to toclocoinc.github.io; does nothing anywhere else. localhost never needs a key.
      LatticeGrid.setLicence('LG1.eyJ2IjoxLCJwIjoibGF0dGljZS1ncmlkIiwidCI6IlRPQ0xPQ08gSW5jIC0gcHVibGljIGRlbW9zIiwiZSI6IjIwMzAtMDEtMDEiLCJkIjpbInRvY2xvY29pbmMuZ2l0aHViLmlvIl19.9De42ua3aCGpiMB6EVRP7Tv-upUlDI-0T07rlSPzvCrsqg8t4YJi7SRnStEpAg48uzmcG7il1fR_TfwkUE7iCA');

  </head>
  <body>
    <header class="page-head">
      <h1>Content calendar</h1>
      <p class="lede">
        ~200 synthetic social posts, one <code>createDataRouter</code> feed, three viewers: a grid,
        a kanban board and a week/month calendar. Drag a scheduled post to another day and the grid
        and the board update without a refresh.
      </p>
    </header>

    <div class="toolbar">
      <div class="toggle" role="group" aria-label="View">
        <button type="button" data-view="table" aria-pressed="true">Table</button>
        <button type="button" data-view="board" aria-pressed="false">Board</button>
        <button type="button" data-view="calendar" aria-pressed="false">Calendar</button>
      </div>
      <div class="toggle" role="group" aria-label="Calendar range">
        <button type="button" id="cal-week">Week</button>
        <button type="button" id="cal-month">Month</button>
      </div>
      <button type="button" id="new-post" class="primary">A new post arrives</button>
    </div>

    <div id="kpi" class="kpi"></div>
    <div id="grid" class="panel"></div>
    <div id="board" class="panel" hidden></div>
    <div id="calendar" class="panel" hidden></div>

    <footer class="page-foot">
      <p>
        <a href="https://www.npmjs.com/package/@toclocoinc/lattice-grid">@toclocoinc/lattice-grid</a>
        on npm &middot; <a href="https://github.com/toclocoinc/latticegrid">grid repository</a>
        &middot; <a href="https://www.latticegrid.dev">latticegrid.dev</a>
      </p>
    </footer>

    <script type="module" src="./app.js?v=20261003u"></script>
  </body>
</html>
